<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#10131a" />
    <title>Chat with Rishi</title>
    <style>
      :root {
        color-scheme: dark;
        font-family:
          Inter,
          ui-sans-serif,
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
        background: #10131a;
        color: #f4f5f7;
        font-synthesis: none;
        text-rendering: optimizeLegibility;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-width: 320px;
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 24px;
        background:
          radial-gradient(
            ellipse at 50% 0%,
            rgba(100, 82, 224, 0.18),
            transparent 50%
          ),
          #10131a;
      }

      button,
      input {
        font: inherit;
      }

      .chat {
        width: min(100%, 480px);
        height: min(760px, calc(100vh - 48px));
        min-height: 420px;
        display: flex;
        flex-direction: column;
        overflow: hidden;
        border: 1px solid #292d38;
        border-radius: 20px;
        background: #171a22;
        box-shadow: 0 24px 80px rgba(0, 0, 0, 0.42);
      }

      .chat-header {
        display: flex;
        align-items: center;
        gap: 13px;
        padding: 18px 20px;
        border-bottom: 1px solid #292d38;
      }

      .avatar {
        width: 44px;
        height: 44px;
        display: grid;
        place-items: center;
        flex: 0 0 auto;
        border-radius: 50%;
        background: linear-gradient(135deg, #aa8cff, #7056dc);
        color: #fff;
        font-size: 17px;
        font-weight: 700;
      }

      .contact {
        min-width: 0;
      }

      .contact h1 {
        margin: 0;
        font-size: 15px;
        font-weight: 650;
      }

      .contact p {
        margin: 4px 0 0;
        color: #9298a7;
        font-size: 12px;
      }

      .online-dot {
        display: inline-block;
        width: 7px;
        height: 7px;
        margin-right: 5px;
        border-radius: 50%;
        background: #54d69a;
        vertical-align: 1px;
      }

      .messages {
        flex: 1;
        display: flex;
        flex-direction: column;
        gap: 16px;
        overflow-y: auto;
        padding: 22px 18px;
        scrollbar-color: #424653 transparent;
        scrollbar-width: thin;
      }

      .day-label {
        align-self: center;
        margin: 0 0 2px;
        color: #777e8e;
        font-size: 11px;
        letter-spacing: 0.04em;
      }

      .message {
        max-width: 82%;
        display: flex;
        flex-direction: column;
        gap: 5px;
        align-self: flex-start;
      }

      .message.sent {
        align-self: flex-end;
        align-items: flex-end;
      }

      .bubble {
        padding: 11px 14px;
        border: 1px solid #2d313c;
        border-radius: 16px 16px 16px 5px;
        background: #222630;
        color: #e9eaf0;
        font-size: 14px;
        line-height: 1.5;
        overflow-wrap: anywhere;
        white-space: pre-wrap;
      }

      .sent .bubble {
        border-color: #7760e8;
        border-radius: 16px 16px 5px 16px;
        background: #7058dc;
        color: #fff;
      }

      .message time {
        padding: 0 3px;
        color: #777e8e;
        font-size: 10px;
      }

      .composer {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 14px 16px;
        border-top: 1px solid #292d38;
        background: #191c25;
      }

      .composer input {
        width: 100%;
        min-width: 0;
        padding: 12px 14px;
        border: 1px solid #303541;
        border-radius: 12px;
        outline: none;
        background: #222630;
        color: #f4f5f7;
        font-size: 14px;
      }

      .composer input::placeholder {
        color: #858b99;
      }

      .composer input:focus {
        border-color: #8873ef;
        box-shadow: 0 0 0 3px rgba(136, 115, 239, 0.15);
      }

      .send-button {
        width: 44px;
        height: 44px;
        display: grid;
        place-items: center;
        flex: 0 0 auto;
        border: 0;
        border-radius: 12px;
        background: #7058dc;
        color: #fff;
        cursor: pointer;
        transition:
          background 150ms ease,
          transform 150ms ease;
      }

      .send-button:hover {
        background: #8069e8;
      }

      .send-button:active {
        transform: scale(0.96);
      }

      .send-button:focus-visible {
        outline: 3px solid #b4a7ff;
        outline-offset: 2px;
      }

      @media (max-width: 520px) {
        body {
          padding: 0;
        }

        .chat {
          width: 100%;
          height: 100vh;
          min-height: 0;
          border: 0;
          border-radius: 0;
        }
      }
    </style>
  </head>
  <body>
    <main class="chat" aria-label="Chat conversation">
      <header class="chat-header">
        <div class="avatar" aria-hidden="true">R</div>
        <div class="contact">
          <h1>Rishi</h1>
          <p><span class="online-dot" aria-hidden="true"></span>Online</p>
        </div>
      </header>

      <section
        class="messages"
        id="live-chat"
        aria-label="Messages"
        aria-live="polite"
      >
        <p class="day-label">TODAY</p>
      </section>

      <form class="composer" id="chat-form">
        <input
          id="input-chat"
          type="text"
          placeholder="Write a message..."
          aria-label="Write a message"
          autocomplete="off"
        />
        <button class="send-button" type="submit" aria-label="Send message">
          <svg
            aria-hidden="true"
            width="19"
            height="19"
            viewBox="0 0 24 24"
            fill="none"
          >
            <path
              d="M22 2 11 13"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
            <path
              d="m22 2-7 20-4-9-9-4 20-7Z"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
          </svg>
        </button>
      </form>
    </main>

    <script src="/socket.io/socket.io.js"></script>
    <script>
      const socket = io();

      socket.on("server:message", (data) => {
        console.log(data);
        const message = document.createElement("article");
        message.className = "message";

        const bubble = document.createElement("div");
        bubble.className = "bubble";
        bubble.textContent = data.text;

        const time = document.createElement("time");
        time.dateTime = new Date().toISOString();
        time.textContent = new Intl.DateTimeFormat(undefined, {
          hour: "numeric",
          minute: "2-digit",
        }).format(new Date());

        message.append(bubble, time);
        messages.append(message);
      });

      const chatForm = document.getElementById("chat-form");
      const chatInput = document.getElementById("input-chat");
      const messages = document.getElementById("live-chat");

      chatForm.addEventListener("submit", (event) => {
        event.preventDefault();
        const text = chatInput.value.trim();

        if (!text) return;

        const message = document.createElement("article");
        message.className = "message sent";

        const bubble = document.createElement("div");
        bubble.className = "bubble";
        bubble.textContent = text;

        const time = document.createElement("time");
        time.dateTime = new Date().toISOString();
        time.textContent = new Intl.DateTimeFormat(undefined, {
          hour: "numeric",
          minute: "2-digit",
        }).format(new Date());

        message.append(bubble, time);
        messages.append(message);

        socket.emit("user:message", { text });
        chatInput.value = "";
        messages.scrollTop = messages.scrollHeight;
        chatInput.focus();
      });
    </script>
  </body>
</html>
